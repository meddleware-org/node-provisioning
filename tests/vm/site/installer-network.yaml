# The QEMU VM's installer network: one port matched by name, with QEMU's user-mode address (10.0.2.15), gateway and resolver.
network:
  version: 2
  renderer: networkd
  ethernets:
    nic:
      # Match any port whose name starts with `en`, because the VM's port name varies.
      match:
        name: "en*"
      dhcp4: false
      dhcp6: false
      # QEMU's user-mode defaults.
      addresses:
        - 10.0.2.15/24
      routes:
        - to: default
          via: 10.0.2.2
      nameservers:
        addresses:
          - 10.0.2.3
