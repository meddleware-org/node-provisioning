# Installed-system netplan for the QEMU test VM.
network:
  # Netplan schema version 2 (the same address, gateway and resolver as the installer's network).
  version: 2
  renderer: networkd
  ethernets:
    nic:
      # Match any port whose name starts with `en`.
      match:
        name: "en*"
      dhcp4: false
      dhcp6: false
      # QEMU's user-mode defaults.
      addresses:
        - 10.0.2.15/24
      routes:
        - to: default
          via: 10.0.2.2
      nameservers:
        addresses:
          - 10.0.2.3
