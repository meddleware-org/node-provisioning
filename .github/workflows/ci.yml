name: CI

# Runs on every push and pull request, and when the release workflow calls it (so a release can never skip a check).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_call:

# Read-only: no job here writes to the repository.
permissions:
  contents: read

# DO_NOT_TRACK asks the tools run here not to send usage data.
env:
  DO_NOT_TRACK: "1"

# Four independent jobs: lint, hygiene, version consistency and the tests.
jobs:
  # Shell scripts and workflow files are linted: shellcheck at warning level over every script, and actionlint over the workflows.
  lint:
    name: shellcheck + actionlint
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit hash, with the version as a comment so Dependabot can update both.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # shellcheck is preinstalled on the GitHub-hosted Ubuntu runners.
      - name: shellcheck
        run: |
          shellcheck -S warning -x -P SCRIPTDIR bin/node-provisioning lib/*.sh scripts/*.sh tests/*.sh tests/data-disk/*.sh tests/vm/*.sh targets/*/node-setup/*.sh
      # actionlint runs from an image pinned by digest.
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo docker.io/rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color

  # No identifying or secret-shaped value may be in the repository (this is a public repository), and the file system is scanned for vulnerabilities, misconfigurations and secrets.
  hygiene:
    name: public hygiene + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The denylist comes from a repository secret, so the values it lists never appear in the repository.
      - name: hygiene check (identifying and secret-shaped values)
        env:
          HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}
        run: bash scripts/check-public-hygiene.sh
      # Critical and high findings with a fix fail the build.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # VERSION must be a plain semantic version (and, on a tag, equal the tag).
  versions:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/check-versions.sh

  # Every tests/*.test.sh runs offline against fixtures; the tools they need are installed first.
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tools the tests drive: image builders, netplan, YAML and JSON-schema libraries.
      - name: install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -q xorriso dosfstools mtools netplan.io python3-yaml python3-jsonschema file
      # The autoinstall schema is downloaded (never vendored) and checked against its pinned checksum.
      - name: fetch the pinned Subiquity schema
        run: bash scripts/fetch-subiquity-schema.sh
      # The whole suite.
      - name: tests
        run: bash tests/run.sh
