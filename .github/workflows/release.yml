name: Release

# On a v* tag: gate on VERSION, run the full CI on the tagged commit, build the release tarball deterministically
# (git archive), sign it keylessly (cosign bundle + GitHub attestation), publish it as a GitHub Release, and push the
# SAME bytes as an OCI artifact to quay.io and Docker Hub. A manual run is a dry run: build and verify only.
# A version tag publishes; a manual run is a dry run unless it is switched off on a tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    # The one input: a manual run is a dry run unless this is switched off.
    inputs:
      # dry_run defaults to true, so starting the workflow by hand can never publish by accident.
      dry_run:
        description: "Dry run: build and verify only; nothing is signed or published"
        type: boolean
        default: true

# Read-only by default; the jobs that sign or publish ask for more, one by one.
permissions:
  contents: read

# DO_NOT_TRACK asks the tools run here not to send usage data.
env:
  DO_NOT_TRACK: "1"

# The release is a chain: check the version, run CI, build the tarball without credentials, sign it, publish it to GitHub and to two registries.
jobs:
  # Decide dry run or publish, and refuse to publish from anything but a v* tag.
  version:
    name: Tag matches VERSION
    runs-on: ubuntu-latest
    # The mode, passed on to the jobs that sign and publish.
    outputs:
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      # Actions are pinned to a commit hash, with the version as a comment so Dependabot can update both.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Dry run only when manually started with dry_run on; otherwise this must be a v* tag, and VERSION must match it.
      - id: mode
        env:
          # The event, the dry-run input and the ref reach the script as environment variables, never spliced into the script text.
          EVENT: ${{ github.event_name }}
          DRY: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
        run: |
          if [ "${EVENT}" = workflow_dispatch ] && [ "${DRY}" = true ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "Dry run: nothing is signed or published." >> "$GITHUB_STEP_SUMMARY"
          else
            case "${REF}" in
              refs/tags/v*) ;;
              *) echo "::error::publishing needs a v* tag (got ${REF}); run with dry_run on a branch"; exit 1 ;;
            esac
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            bash scripts/check-versions.sh
          fi

  # The release runs exactly what CI runs, on the tagged commit.
  verify:
    name: Verify (CI checks)
    uses: ./.github/workflows/ci.yml
    # The called CI workflow gets the same secrets (the hygiene denylist).
    secrets: inherit

  # The tarball is built with no credentials in reach.
  build:
    name: Build the release tarball (no credentials)
    # The build waits for the version check and for CI.
    needs: [version, verify]
    runs-on: ubuntu-latest
    outputs:
      # The version and the commit time, for the jobs that sign and publish.
      version: ${{ steps.tar.outputs.version }}
      epoch: ${{ steps.tar.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `git archive` of HEAD with a fixed prefix and `gzip -n` (no timestamp), built twice: the two must be byte-identical, so anyone can rebuild it.
      - id: tar
        run: |
          set -euo pipefail
          # The version from the file, and the commit's time (used as the artifact's creation time).
          VERSION="$(tr -d '[:space:]' < VERSION)"
          EPOCH="$(git log -1 --format=%ct)"
          # build <file>: the tarball of HEAD under a fixed directory prefix, compressed without a timestamp, so the same commit always gives the same bytes.
          build() { git archive --format=tar --prefix="node-provisioning-${VERSION}/" HEAD | gzip -n -9 > "$1"; }
          build "node-provisioning-${VERSION}.tar.gz"
          build "rebuild.tar.gz"
          cmp "node-provisioning-${VERSION}.tar.gz" rebuild.tar.gz   # deterministic: a rebuild is byte-identical
          rm -f rebuild.tar.gz
          # The checksum file and the outputs.
          sha256sum "node-provisioning-${VERSION}.tar.gz" > SHA256SUMS
          cat SHA256SUMS
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "epoch=${EPOCH}" >> "$GITHUB_OUTPUT"
      # CI plumbing never ships in the tarball.
      - name: tarball contents sanity (no CI plumbing, no site data)
        run: |
          set -euo pipefail
          if tar -tzf node-provisioning-*.tar.gz | grep -qE '/\.github/'; then echo "::error::CI files in the release tarball"; exit 1; fi
      # Hand the files to the later jobs for a day.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            node-provisioning-*.tar.gz
            SHA256SUMS
          # Kept for a day: the later jobs start right after this one.
          retention-days: 1
          # A missing file is an error, not an empty upload.
          if-no-files-found: error

  # Sign the tarball keylessly with Sigstore and add a GitHub build-provenance attestation. Only on a real release.
  sign:
    name: Sign and attest
    # Signing needs the build.
    needs: [version, build]
    # Skipped on a dry run.
    if: needs.version.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The identity token Sigstore's keyless signing needs, and permission to write the attestation.
      id-token: write
      attestations: write
    steps:
      # Fetch the files the build produced.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
      # The signing tool, pinned.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Verify the checksum, then sign the tarball and write the bundle beside it.
      - name: cosign sign-blob (keyless)
        env:
          # The version as an environment variable, again never spliced into the script.
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          cosign sign-blob --yes --bundle "node-provisioning-${VERSION}.tar.gz.sigstore.json" "node-provisioning-${VERSION}.tar.gz"
      # Attest where and how the tarball was built.
      - name: GitHub build-provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          # The file the attestation is about.
          subject-path: node-provisioning-${{ needs.build.outputs.version }}.tar.gz
          # No extra storage record is created.
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The signature bundle, for the publish jobs.
          name: signature
          path: node-provisioning-*.tar.gz.sigstore.json
          retention-days: 1
          if-no-files-found: error

  # Create the GitHub Release with the tarball, its signature bundle and the checksums. A re-run does not change anything: if the release exists, its files are compared with this build.
  publish-github:
    name: GitHub Release
    # Publishing needs the signed files.
    needs: [version, build, sign]
    if: needs.version.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      # The only job that may write to the repository (to create the release).
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Every artifact (the tarball, the checksums and the signature).
          pattern: "*"
          merge-multiple: true
      # Idempotent create-or-verify.
      - name: "create the release (idempotent; a re-run only verifies)"
        env:
          # The workflow's own token, used by the `gh` command.
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # An existing release is verified against this build, never overwritten.
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists: verifying its assets against this build"
            mkdir existing && gh release download "${TAG}" --repo "${REPO}" --dir existing
            for f in node-provisioning-*.tar.gz SHA256SUMS; do cmp "${f}" "existing/${f}"; done
          else
            # Create the release from the existing tag (`--verify-tag` refuses a tag that does not exist).
            gh release create "${TAG}" --repo "${REPO}" --verify-tag --title "${TAG}" \
              --notes "Release ${TAG}. Verify with cosign verify-blob (see SECURITY.md)." \
              node-provisioning-*.tar.gz node-provisioning-*.tar.gz.sigstore.json SHA256SUMS
          fi

  # Push the very same tarball as an OCI artifact to two registries.
  publish-oci:
    name: OCI artifact (quay.io + Docker Hub)
    needs: [version, build, sign]
    if: needs.version.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*"
          merge-multiple: true
      # The OCI client, pinned.
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          # The pinned oras version.
          version: 1.3.4
      # Push once to quay.io with a fixed creation time (otherwise every push would get a new manifest digest), copy that exact manifest to Docker Hub, and check that layer 0 is the tarball in both places and that both registries report the same manifest digest.
      - name: push once, copy by digest, assert the layer is the tarball
        env:
          VERSION: ${{ needs.build.outputs.version }}
          EPOCH: ${{ needs.build.outputs.epoch }}
          # Registry credentials come from repository secrets and exist only in this step.
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The two repositories, the tarball, the digest the registries must report for it and the fixed creation time.
          QUAY="quay.io/meddleware-org/node-provisioning"
          HUB="docker.io/meddleware/node-provisioning"
          TARBALL="node-provisioning-${VERSION}.tar.gz"
          WANT="sha256:$(sha256sum "${TARBALL}" | cut -d' ' -f1)"
          CREATED="$(date -u -d "@${EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"
          # Log in with the token read from standard input, so it is never on a command line.
          printf '%s' "${QUAY_TOKEN}" | oras login quay.io -u "${QUAY_USERNAME}" --password-stdin
          printf '%s' "${DOCKERHUB_TOKEN}" | oras login docker.io -u "${DOCKERHUB_USERNAME}" --password-stdin
          # one push, with a fixed creation time (otherwise every push would get a new manifest digest)
          oras push "${QUAY}:${VERSION}" --artifact-type application/vnd.meddleware.node-provisioning.v1 \
            --annotation "org.opencontainers.image.created=${CREATED}" \
            "${TARBALL}:application/gzip" "${TARBALL}.sigstore.json:application/vnd.dev.sigstore.bundle.v0.3+json"
          # Copy by digest, so Docker Hub holds exactly the manifest quay.io holds.
          oras cp "${QUAY}:${VERSION}" "${HUB}:${VERSION}"
          # Both registries must report the tarball as layer 0.
          for ref in "${QUAY}:${VERSION}" "${HUB}:${VERSION}"; do
            got="$(oras manifest fetch "${ref}" | python3 -c 'import sys,json; print(json.load(sys.stdin)["layers"][0]["digest"])')"
            [ "${got}" = "${WANT}" ] || { echo "::error::${ref} layer 0 is ${got}, expected ${WANT}"; exit 1; }
            echo "${ref}: layer 0 = ${got}"
          done
          # And both must report the same manifest digest.
          [ "$(oras manifest fetch --descriptor "${QUAY}:${VERSION}" | python3 -c 'import sys,json; print(json.load(sys.stdin)["digest"])')" = \
            "$(oras manifest fetch --descriptor "${HUB}:${VERSION}" | python3 -c 'import sys,json; print(json.load(sys.stdin)["digest"])')" ] \
            || { echo "::error::registries disagree on the manifest digest"; exit 1; }
