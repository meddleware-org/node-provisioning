name: Release

# On a v* tag: gate on VERSION, run the full CI on the tagged commit, build the release tarball deterministically
# (git archive), sign it keylessly (cosign bundle + GitHub attestation), publish it as a GitHub Release, and push the
# SAME bytes as an OCI artifact to quay.io and Docker Hub. A manual run is a dry run: build and verify only.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and verify only; nothing is signed or published"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  version:
    name: Tag matches VERSION
    runs-on: ubuntu-latest
    outputs:
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: mode
        env:
          EVENT: ${{ github.event_name }}
          DRY: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
        run: |
          if [ "${EVENT}" = workflow_dispatch ] && [ "${DRY}" = true ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "Dry run: nothing is signed or published." >> "$GITHUB_STEP_SUMMARY"
          else
            case "${REF}" in
              refs/tags/v*) ;;
              *) echo "::error::publishing needs a v* tag (got ${REF}); run with dry_run on a branch"; exit 1 ;;
            esac
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            bash scripts/check-versions.sh
          fi

  verify:
    name: Verify (CI checks)
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build the release tarball (no credentials)
    needs: [version, verify]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tar.outputs.version }}
      epoch: ${{ steps.tar.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tar
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          EPOCH="$(git log -1 --format=%ct)"
          build() { git archive --format=tar --prefix="node-provisioning-${VERSION}/" HEAD | gzip -n -9 > "$1"; }
          build "node-provisioning-${VERSION}.tar.gz"
          build "rebuild.tar.gz"
          cmp "node-provisioning-${VERSION}.tar.gz" rebuild.tar.gz   # deterministic: a rebuild is byte-identical
          rm -f rebuild.tar.gz
          sha256sum "node-provisioning-${VERSION}.tar.gz" > SHA256SUMS
          cat SHA256SUMS
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "epoch=${EPOCH}" >> "$GITHUB_OUTPUT"
      - name: tarball contents sanity (no CI plumbing, no site data)
        run: |
          set -euo pipefail
          if tar -tzf node-provisioning-*.tar.gz | grep -qE '/\.github/'; then echo "::error::CI files in the release tarball"; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            node-provisioning-*.tar.gz
            SHA256SUMS
          retention-days: 1
          if-no-files-found: error

  sign:
    name: Sign and attest
    needs: [version, build]
    if: needs.version.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: cosign sign-blob (keyless)
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          cosign sign-blob --yes --bundle "node-provisioning-${VERSION}.tar.gz.sigstore.json" "node-provisioning-${VERSION}.tar.gz"
      - name: GitHub build-provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: node-provisioning-${{ needs.build.outputs.version }}.tar.gz
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: node-provisioning-*.tar.gz.sigstore.json
          retention-days: 1
          if-no-files-found: error

  publish-github:
    name: GitHub Release
    needs: [version, build, sign]
    if: needs.version.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*"
          merge-multiple: true
      - name: "create the release (idempotent; a re-run only verifies)"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists: verifying its assets against this build"
            mkdir existing && gh release download "${TAG}" --repo "${REPO}" --dir existing
            for f in node-provisioning-*.tar.gz SHA256SUMS; do cmp "${f}" "existing/${f}"; done
          else
            gh release create "${TAG}" --repo "${REPO}" --verify-tag --title "${TAG}" \
              --notes "Release ${TAG}. Verify with cosign verify-blob (see SECURITY.md)." \
              node-provisioning-*.tar.gz node-provisioning-*.tar.gz.sigstore.json SHA256SUMS
          fi

  publish-oci:
    name: OCI artifact (quay.io + Docker Hub)
    needs: [version, build, sign]
    if: needs.version.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*"
          merge-multiple: true
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.4
      - name: push once, copy by digest, assert the layer is the tarball
        env:
          VERSION: ${{ needs.build.outputs.version }}
          EPOCH: ${{ needs.build.outputs.epoch }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          QUAY="quay.io/meddleware-org/node-provisioning"
          HUB="docker.io/meddleware/node-provisioning"
          TARBALL="node-provisioning-${VERSION}.tar.gz"
          WANT="sha256:$(sha256sum "${TARBALL}" | cut -d' ' -f1)"
          CREATED="$(date -u -d "@${EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s' "${QUAY_TOKEN}" | oras login quay.io -u "${QUAY_USERNAME}" --password-stdin
          printf '%s' "${DOCKERHUB_TOKEN}" | oras login docker.io -u "${DOCKERHUB_USERNAME}" --password-stdin
          # one push, with a fixed creation time (otherwise every push would get a new manifest digest)
          oras push "${QUAY}:${VERSION}" --artifact-type application/vnd.meddleware.node-provisioning.v1 \
            --annotation "org.opencontainers.image.created=${CREATED}" \
            "${TARBALL}:application/gzip" "${TARBALL}.sigstore.json:application/vnd.dev.sigstore.bundle.v0.3+json"
          oras cp "${QUAY}:${VERSION}" "${HUB}:${VERSION}"
          for ref in "${QUAY}:${VERSION}" "${HUB}:${VERSION}"; do
            got="$(oras manifest fetch "${ref}" | python3 -c 'import sys,json; print(json.load(sys.stdin)["layers"][0]["digest"])')"
            [ "${got}" = "${WANT}" ] || { echo "::error::${ref} layer 0 is ${got}, expected ${WANT}"; exit 1; }
            echo "${ref}: layer 0 = ${got}"
          done
          [ "$(oras manifest fetch --descriptor "${QUAY}:${VERSION}" | python3 -c 'import sys,json; print(json.load(sys.stdin)["digest"])')" = \
            "$(oras manifest fetch --descriptor "${HUB}:${VERSION}" | python3 -c 'import sys,json; print(json.load(sys.stdin)["digest"])')" ] \
            || { echo "::error::registries disagree on the manifest digest"; exit 1; }
