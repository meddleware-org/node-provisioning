# Netplan for the installed system: an LACP bond carrying one tagged VLAN.
network:
  version: 2
  renderer: networkd
  ethernets:
    enp1s0:
      dhcp4: false
      dhcp6: false
    enp2s0:
      dhcp4: false
      dhcp6: false
  bonds:
    bond0:
      interfaces:
        - enp1s0
        - enp2s0
      parameters:
        mode: 802.3ad
        lacp-rate: fast
        transmit-hash-policy: layer3+4
        mii-monitor-interval: 100
  vlans:
    bond0.100:
      id: 100
      link: bond0
      dhcp4: false
      dhcp6: false
      addresses:
        - "192.0.2.10/24"
      routes:
        - to: default
          via: 192.0.2.1
      nameservers:
        addresses:
          - 192.0.2.53
        search:
          - example.invalid
